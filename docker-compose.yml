services:
  consul:
    image: hashicorp/consul:1.19
    ports: ["8500:8500"]
    command: agent -dev -client=0.0.0.0

  seq:
    image: datalust/seq:latest
    environment:
      - ACCEPT_EULA=y
      - SEQ_FIRSTRUN_NOAUTHENTICATION=true
    ports: ["5341:5341", "8081:80"]

  user-db:
    image: postgres:16
    environment:
      POSTGRES_DB: userdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5433:5432"]
    volumes: ["user_db_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d userdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  product-db:
    image: postgres:16
    environment:
      POSTGRES_DB: productdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5434:5432"]
    volumes: ["product_db_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d productdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  order-db:
    image: postgres:16
    environment:
      POSTGRES_DB: orderdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5435:5432"]
    volumes: ["order_db_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d orderdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  user-service:
    build:
      context: ./UserService
      dockerfile: Dockerfile
    depends_on:
      user-db:
        condition: service_healthy
      consul:
        condition: service_started
      seq:
        condition: service_started
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    ports: ["5001:8080"]

  product-service:
    build:
      context: ./ProductService/ProductService
      dockerfile: Dockerfile
    depends_on:
      product-db:
        condition: service_healthy
      consul:
        condition: service_started
      seq:
        condition: service_started
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    ports: ["5002:8080"]

  order-service:
    build:
      context: ./OrderService/OrderService
      dockerfile: Dockerfile
    depends_on:
      order-db:
        condition: service_healthy
      consul:
        condition: service_started
      seq:
        condition: service_started
      product-service:
        condition: service_started
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    ports: ["5003:8080"]

  api-gateway:
    build:
      context: ./ApiGateway/ApiGateway
      dockerfile: Dockerfile
    depends_on:
      user-service:
        condition: service_started
      product-service:
        condition: service_started
      order-service:
        condition: service_started
      consul:
        condition: service_started
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    ports: ["5000:8080"]

  neo4j:
    image: neo4j:5.24
    environment:
      - NEO4J_AUTH=neo4j/password123
      - NEO4J_PLUGINS=["apoc"]
    ports: ["7474:7474", "7687:7687"]
    volumes: ["neo4j_data:/data"]

  soc-db:
    image: postgres:16
    environment:
      POSTGRES_DB: socdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5436:5432"]
    volumes: ["soc_db_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d socdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  soc-event-service:
    build:
      context: ./SocEventService/SocEventService
      dockerfile: Dockerfile
    depends_on:
      soc-db:
        condition: service_healthy
      neo4j:
        condition: service_started
      consul:
        condition: service_started
      seq:
        condition: service_started
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    ports: ["5004:8080"]

volumes:
  user_db_data:
  product_db_data:
  order_db_data:
  neo4j_data:
  soc_db_data:

  